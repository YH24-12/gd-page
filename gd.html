            if (urlParams.get('widget') === 'true') {
                document.body.classList.add('widget-mode');
                isWidgetMode = true;
            }
            
            // 自动定位到当前日期
            const now = new Date();
            const today = now.toISOString().split('T')[0];
            const validDates = ["2025-05-25", "2025-05-26", "2025-05-27", "2025-05-28", "2025-05-29"];
            
            if (validDates.includes(today)) {
                currentDate = today;
                dateSelector.value = today;
            }
            
            renderSchedule();
            setupEventListeners();
            
            // 每分钟自动刷新当前时间高亮
            setInterval(locateCurrentTimeSilent, 60000);
        }

        function updateViewButtons() {
            if (currentView === "timeline") {
                timelineViewBtn.classList.remove('bg-white', 'text-gray-700', 'hover:bg-gray-100');
                timelineViewBtn.classList.add('bg-blue-500', 'text-white');
                listViewBtn.classList.remove('bg-blue-500', 'text-white');
                listViewBtn.classList.add('bg-white', 'text-gray-700', 'hover:bg-gray-100');
            } else {
                listViewBtn.classList.remove('bg-white', 'text-gray-700', 'hover:bg-gray-100');
                listViewBtn.classList.add('bg-blue-500', 'text-white');
                timelineViewBtn.classList.remove('bg-blue-500', 'text-white');
                timelineViewBtn.classList.add('bg-white', 'text-gray-700', 'hover:bg-gray-100');
            }
        }

        // 过滤数据
        function filterData() {
            return scheduleData.filter(task => {
                const dateMatch = task.date === currentDate;
                const cityMatch = currentCity === "all" || task.city === currentCity;
                return dateMatch && cityMatch;
            });
        }

        // 渲染日程
        function renderSchedule() {
            const filteredData = filterData();
            
            if (filteredData.length === 0) {
                scheduleContainer.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <p class="text-xl">当日无符合条件的日程安排</p>
                    </div>
                `;
                return;
            }

            if (currentView === "timeline") {
                renderTimelineView(filteredData);
            } else {
                renderListView(filteredData);
            }
        }

        // 渲染时间轴视图
        function renderTimelineView(data) {
            let html = `
                <div class="relative">
                    <div class="absolute left-4 top-0 bottom-0 w-0.5 bg-gray-200"></div>
                    <div class="space-y-6">
            `;

            data.forEach((task, index) => {
                const timeDisplay = task.time_segment || "待定时间";
                const colorClass = typeColors[task.type] || typeColors["其他"];
                const icon = typeIcons[task.type] || typeIcons["其他"];
                
                html += `
                    <div class="relative pl-12 fade-in" style="animation-delay: ${index * 0.1}s">
                        <div class="absolute left-0 w-8 h-8 rounded-full ${colorClass.split(' ')[0]} border-2 ${colorClass.split(' ')[1]} flex items-center justify-center">
                            ${icon}
                        </div>
                        <div class="task-card bg-white border-l-4 ${colorClass.split(' ')[1]} rounded-lg shadow-sm p-4 cursor-pointer transition-all duration-200" onclick="showTaskDetail(${index})">
                            <div class="text-xl font-bold text-gray-800 mb-2">${timeDisplay}</div>
                            <h3 class="font-bold text-lg text-gray-800 mb-2">${task.task}</h3>
                            ${task.location ? `<p class="text-gray-600 mb-1"><span class="font-medium">地点:</span> ${task.location}</p>` : ''}
                            ${task.city ? `<span class="inline-block px-2 py-1 text-xs rounded-full ${colorClass}">${task.city}</span>` : ''}
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;
            
            scheduleContainer.innerHTML = html;
        }

        // 渲染列表视图
        function renderListView(data) {
            let html = `
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-gray-200">
                                <th class="text-left py-3 px-4 font-bold text-lg text-gray-700">时间</th>
                                <th class="text-left py-3 px-4 font-semibold text-gray-700">任务</th>
                                <th class="text-left py-3 px-4 font-semibold text-gray-700">地点</th>
                                <th class="text-left py-3 px-4 font-semibold text-gray-700">城市</th>
                                <th class="text-left py-3 px-4 font-semibold text-gray-700">类型</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            data.forEach((task, index) => {
                const timeDisplay = task.time_segment || "待定";
                const colorClass = typeColors[task.type] || typeColors["其他"];
                
                html += `
                    <tr class="border-b border-gray-100 hover:bg-gray-50 cursor-pointer transition-colors" onclick="showTaskDetail(${index})">
                        <td class="py-3 px-4 font-bold text-lg">${timeDisplay}</td>
                        <td class="py-3 px-4 font-medium">${task.task}</td>
                        <td class="py-3 px-4 text-gray-600">${task.location || "-"}</td>
                        <td class="py-3 px-4">${task.city || "-"}</td>
                        <td class="py-3 px-4">
                            <span class="inline-block px-2 py-1 text-xs rounded-full ${colorClass}">${task.type}</span>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;
            
            scheduleContainer.innerHTML = html;
        }

        // 显示任务详情
        function showTaskDetail(index) {
            const filteredData = filterData();
            const task = filteredData[index];
            
            modalTitle.textContent = task.task;
            
            let contentHtml = `
                <div class="flex items-center gap-2">
                    <span class="text-gray-600 font-medium">时间:</span>
                    <span class="font-bold text-lg">${task.time_segment || "待定时间"}</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-gray-600 font-medium">日期:</span>
                    <span>${task.date}</span>
                </div>
            `;
            
            if (task.location) {
                contentHtml += `
                    <div class="flex items-start gap-2">
                        <span class="text-gray-600 font-medium">地点:</span>
                        <span>${task.location}</span>
                    </div>
                `;
            }
            
            if (task.city) {
                contentHtml += `
                    <div class="flex items-center gap-2">
                        <span class="text-gray-600 font-medium">城市:</span>
                        <span class="inline-block px-2 py-1 text-xs rounded-full ${typeColors[task.type]}">${task.city}</span>
                    </div>
                `;
            }
            
            if (task.contact) {
                contentHtml += `
                    <div class="flex items-start gap-2">
                        <span class="text-gray-600 font-medium">备注:</span>
                        <span>${task.contact}</span>
                    </div>
                `;
            }
            
            contentHtml += `
                <div class="flex items-center gap-2">
                    <span class="text-gray-600 font-medium">类型:</span>
                    <span class="inline-block px-2 py-1 text-xs rounded-full ${typeColors[task.type]}">${task.type}</span>
                </div>
            `;
            
            modalContent.innerHTML = contentHtml;
            detailModal.classList.remove('hidden');
        }

        // 定位当前时间（带滚动和高亮）
        function locateCurrentTime() {
            const now = new Date();
            const today = now.toISOString().split('T')[0];
            
            // 检查当前日期是否在日程范围内
            const validDates = ["2025-05-25", "2025-05-26", "2025-05-27", "2025-05-28", "2025-05-29"];
            
            if (!validDates.includes(today)) {
                alert("当前日期不在出差日程范围内");
                return;
            }
            
            // 切换到当前日期
            currentDate = today;
            dateSelector.value = today;
            currentCity = "all";
            cityFilter.value = "all";
            
            renderSchedule();
            
            // 滚动到当前时间附近的任务
            scrollToCurrentTask();
        }

        // 静默定位当前时间（仅高亮，不滚动和弹窗）
        function locateCurrentTimeSilent() {
            const now = new Date();
            const today = now.toISOString().split('T')[0];
            const validDates = ["2025-05-25", "2025-05-26", "2025-05-27", "2025-05-28", "2025-05-29"];
            
            if (!validDates.includes(today)) {
                return;
            }
            
            // 如果当前日期不是选中的日期，不做任何操作
            if (currentDate !== today) {
                return;
            }
            
            // 高亮当前任务
            highlightCurrentTask();
        }

        // 滚动到当前任务
        function scrollToCurrentTask() {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentTimeMinutes = currentHour * 60 + currentMinute;
            
            const filteredData = filterData();
            let closestIndex = 0;
            let minDiff = Infinity;
            
            filteredData.forEach((task, index) => {
                if (task.time_segment) {
                    const [hour, minute] = task.time_segment.split(':').map(Number);
                    const taskTimeMinutes = hour * 60 + minute;
                    const diff = Math.abs(taskTimeMinutes - currentTimeMinutes);
                    
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestIndex = index;
                    }
                }
            });
            
            // 高亮显示最接近的任务
            setTimeout(() => {
                const taskElements = document.querySelectorAll('.task-card, tbody tr');
                if (taskElements[closestIndex]) {
                    taskElements[closestIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                    // 移除所有高亮
                    taskElements.forEach(el => el.classList.remove('current-time', 'border-red-500'));
                    
                    // 添加高亮
                    taskElements[closestIndex].classList.add('current-time', 'border-red-500');
                }
            }, 300);
        }

        // 仅高亮当前任务
        function highlightCurrentTask() {
            const now = new Date();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            const currentTimeMinutes = currentHour * 60 + currentMinute;
            
            const filteredData = filterData();
            let closestIndex = 0;
            let minDiff = Infinity;
            
            filteredData.forEach((task, index) => {
                if (task.time_segment) {
                    const [hour, minute] = task.time_segment.split(':').map(Number);
                    const taskTimeMinutes = hour * 60 + minute;
                    const diff = Math.abs(taskTimeMinutes - currentTimeMinutes);
                    
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestIndex = index;
                    }
                }
            });
            
            const taskElements = document.querySelectorAll('.task-card, tbody tr');
            if (taskElements[closestIndex]) {
                // 移除所有高亮
                taskElements.forEach(el => el.classList.remove('current-time', 'border-red-500'));
                
                // 添加高亮
                taskElements[closestIndex].classList.add('current-time', 'border-red-500');
            }
        }

        // 启动应用
        init();
    </script>
</body>
</html>
